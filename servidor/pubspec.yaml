name: servidor
description: Servidor local que expone el extractor por HTTP para que el canvas (Flutter Web) pueda pedirle arboles de widgets sin lanzar procesos desde el navegador.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  extractor:
    path: ../extractor

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
